<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Clearlist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Manrope','ui-sans-serif','system-ui','sans-serif']},colors:{bg:'var(--bg)',fg:'var(--fg)',mute:'var(--mute)',line:'var(--line)',soft:'var(--soft)'}}}}
</script>
<style>
:root{--bg:#fff;--fg:#0c2d48;--mute:#6b8299;--line:#dbeafe;--soft:#f0f9ff;--sky:#38bdf8;--sky2:#0284c7;--pink:#ff8fc7;--card:#fff;--s1:#f0f9ff;--s2:#fff0f7;--navon:rgba(255,255,255,.88);--navh:rgba(255,255,255,.65);--hov:#e0f2fe;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(900px 500px at 100% -10%,rgba(255,143,199,.16),transparent 60%) fixed,radial-gradient(900px 500px at -10% 0%,rgba(56,189,248,.18),transparent 60%) fixed,var(--bg);color:var(--fg);font-family:Manrope,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.btn{border:1px solid var(--sky2);background:transparent;color:var(--sky2);padding:.5rem 1rem;border-radius:.5rem;font-size:.875rem;font-weight:500;transition:background .25s,color .25s,transform .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
.btn:hover{background:linear-gradient(90deg,#0ea5e9,#f472b6);border-color:transparent;color:#fff;transform:translateY(-2px) scale(1.04)}.btn:active{transform:scale(.94)}.btn:disabled{opacity:.4;pointer-events:none}
.card{border:1px solid var(--line);border-radius:1rem;background:var(--card);transition:border-color .3s,transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
.card:hover{border-color:var(--sky);transform:translateY(-4px) scale(1.012);box-shadow:0 14px 32px -14px rgba(0,0,0,.3)}
.go{cursor:pointer}
.nav{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;padding:.5rem .75rem;border-radius:.5rem;color:var(--mute);font-size:.875rem;white-space:nowrap;transition:background .2s,color .2s,transform .35s cubic-bezier(.34,1.56,.64,1)}
.nav:hover{background:var(--navh);color:var(--fg);transform:translateX(4px)}.nav.on{background:var(--navon);color:#075985;font-weight:700;box-shadow:0 4px 14px -6px rgba(2,132,199,.4)}
.tag{font-size:.7rem;border:1px solid var(--line);border-radius:999px;padding:.1rem .55rem;color:var(--mute);white-space:nowrap}
.tag.hi{border-color:#ff8fc7;background:#ffe9f4;color:#be185d}
.st{width:1.5rem;height:1.5rem;border:1.5px solid #bcd3e6;border-radius:999px;font-size:.7rem;line-height:1;flex:none;transition:all .3s cubic-bezier(.34,1.56,.64,1)}.st:hover{border-color:#38bdf8;box-shadow:0 0 0 4px rgba(56,189,248,.2);transform:scale(1.12)}
.st.d1{border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#38bdf8,#ff8fc7) border-box;color:#0284c7;box-shadow:0 0 0 3px rgba(56,189,248,.18)}
.st.d2{border-color:transparent;background:linear-gradient(135deg,#38bdf8,#ff8fc7);color:#fff;font-weight:800;box-shadow:0 0 14px rgba(255,143,199,.7),0 0 18px rgba(56,189,248,.5)}
.st.lit{animation:lit .7s cubic-bezier(.34,1.56,.64,1)}@keyframes lit{0%{transform:scale(.6)}50%{transform:scale(1.4);box-shadow:0 0 0 10px rgba(255,143,199,.35)}100%{transform:scale(1)}}
.ic{width:1rem;height:1rem;flex:none}
.lbl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.box{border:1px solid var(--line);border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem;background:var(--card);color:var(--fg);outline:none;min-width:0}.box:focus{border-color:var(--sky)}
.row{border-top:1px solid var(--line)}.row:first-child{border-top:0}
.rv{opacity:0;transition:opacity .6s ease,transform .9s cubic-bezier(.34,1.4,.64,1)}
.rv[data-d=l]{transform:translateX(-56px)}.rv[data-d=r]{transform:translateX(56px)}.rv[data-d=u]{transform:translateY(30px)}.rv[data-d=s]{transform:scale(.88) translateY(14px)}
.rv.in{opacity:1;transform:none}
.view{animation:vin .5s cubic-bezier(.2,.7,.2,1)}@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg{animation:vin .35s ease}
.dot{animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.3}}
.logo{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}.logo:hover{transform:scale(1.05)}
.bar{background:linear-gradient(90deg,#38bdf8,#ff8fc7)!important;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1) .25s}
.pop{animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}@keyframes pop{from{opacity:0;transform:scale(.85) translateY(14px)}to{opacity:1;transform:none}}
.nd{width:.55rem;height:.55rem;border-radius:999px;background:#2563eb;flex:none;margin-left:.25rem;animation:ring 1.6s infinite}.nd.w{background:#a3a3a3;animation:pulse 1s infinite alternate}@keyframes ring{0%{box-shadow:0 0 0 0 rgba(37,99,235,.55)}100%{box-shadow:0 0 0 8px rgba(37,99,235,0)}}
#botBtn.has::after{content:"";position:absolute;top:-5px;right:-5px;width:.8rem;height:.8rem;border-radius:999px;background:#2563eb;border:2px solid var(--card);animation:ring 1.6s infinite}
.serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400;letter-spacing:-.01em}
.side{background:radial-gradient(260px 240px at 0% 0%,rgba(56,189,248,.5),transparent 70%),radial-gradient(320px 320px at 100% 100%,rgba(255,143,199,.55),transparent 70%),linear-gradient(180deg,var(--s1),var(--s2))}
.gt{background:linear-gradient(90deg,#0ea5e9,#ff8fc7,#0ea5e9);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 6s linear infinite}@keyframes sheen{to{background-position:200% 0}}
.nav::before{content:"";width:.5rem;height:.5rem;border-radius:99px;border:1.5px solid #9fc0dc;flex:none;transition:all .3s}
.nav.on::before,.nav:hover::before{border-color:transparent;background:linear-gradient(135deg,#38bdf8,#ff8fc7);box-shadow:0 0 10px rgba(255,143,199,.8)}
.nav .nd{margin-left:auto}@keyframes navin{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(500px 400px at 20% 25%,rgba(56,189,248,.14),transparent 60%),radial-gradient(500px 400px at 80% 70%,rgba(255,143,199,.14),transparent 60%);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,30px) scale(1.12)}}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;animation:drift 12s ease-in-out infinite alternate;pointer-events:none}.b1{width:320px;height:320px;background:#38bdf8;top:-80px;left:-60px}.b2{width:360px;height:360px;background:#ff8fc7;bottom:-100px;right:-80px;animation-delay:-6s}
.cd{aspect-ratio:1;border-radius:.75rem;font-size:.85rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px solid transparent;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.cd:hover{background:var(--hov);transform:scale(1.1)}.cd.today{border-color:#ff8fc7}.cd.sel{background:linear-gradient(135deg,#38bdf8,#ff8fc7);color:#fff;font-weight:700;box-shadow:0 6px 16px -6px rgba(244,114,182,.7)}
.dt{width:5px;height:5px;border-radius:99px;display:inline-block}
.toast{position:fixed;left:0;right:0;margin:auto;width:max-content;max-width:90vw;bottom:calc(5rem + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:999px;font-size:.8rem;z-index:80;animation:pop .4s both}
:root[data-theme="dark"]{--bg:#07090d;--fg:#e6f4ff;--mute:#8fb0c7;--line:#1c2a3a;--soft:#111a25;--card:#0e141c;--s1:#0b1622;--s2:#1a0e18;--navon:rgba(125,211,252,.16);--navh:rgba(125,211,252,.09);--hov:#13202e;--sky2:#7dd3fc;color-scheme:dark}
[data-theme=dark] .tag.hi{background:#3a1226;color:#ff9ecf;border-color:#ff8fc7}[data-theme=dark] .nav.on{color:#7dd3fc}[data-theme=dark] .box{border-color:#1c2a3a}
.nav .tag+.nd{margin-left:.35rem}
@media print{body *{visibility:hidden!important}#invdoc,#invdoc *{visibility:visible!important}#invov{position:absolute!important;inset:0!important;background:#fff!important}#invdoc{position:absolute!important;left:0;top:0;width:100%;max-width:none!important;max-height:none!important;box-shadow:none!important;border:0!important;color:#000!important;background:#fff!important}.noprint{display:none!important}}
.xp{position:relative;height:100%;min-height:300px;border-radius:1.25rem;overflow:hidden;background:linear-gradient(135deg,#e0f2fe,#ffe4f1);display:flex;align-items:center;justify-content:center;text-align:center;padding:1.5rem;color:#0c2d48}
.xs>*{animation:vin .6s both}.xs h3{font-size:1.7rem;margin:0}.xs p{margin:.6rem 0 0;color:#4d6a82;font-size:.95rem}
.xa{position:relative;height:120px;width:210px;margin:0 auto 18px}.xa b{position:absolute;border-radius:10px;transform-origin:bottom;animation:fl 2.4s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-12px) rotate(6deg)}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes xb{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.xb{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.06)}.xb i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#ff8fc7);transform-origin:left}
@media (prefers-reduced-motion:reduce){.rv,.view,.msg,.dot,.pop,.nd{transition:none;animation:none;transform:none!important;opacity:1}.card:hover{transform:none}}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day=n=>{const x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()+n);return x};
const fmt=n=>day(n).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const money=n=>'$'+Number(n).toLocaleString('en-US');
const WARN='<svg class="ic" viewBox="0 0 20 20" aria-label="Due soon"><path d="M10 2.5 18.5 17H1.5z" fill="#facc15" stroke="#ca8a04" stroke-linejoin="round"/><path d="M10 7.5v4.2" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="14.3" r="1" fill="#111"/></svg>';
const OVER='<svg class="ic" viewBox="0 0 20 20" aria-label="Overdue"><circle cx="10" cy="10" r="8.5" fill="#dc2626"/><path d="m6.8 6.8 6.4 6.4m0-6.4-6.4 6.4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>';
const flag=(due,done)=>done?'':due<0?OVER:due<=2?WARN:'';

let clients=[
 {id:1,name:'Northwind Studio',contact:'Maya Chen',note:'Brand refresh in progress. Prefers Friday check-ins and short written updates. Wants the logo shortlist narrowed to two.'},
 {id:2,name:'Alder & Co',contact:'Jon Alder',note:'Retainer client. Slow to approve invoices, so send reminders early. Interested in a packaging line later this year.'},
 {id:3,name:'Fieldnote Press',contact:'Priya Nair',note:'Editorial layouts for a quarterly. Needs final files by the 25th each cycle.'},
 {id:4,name:'Halcyon Fitness',contact:'Sam Ortiz',note:'New client. Launching a spring campaign; budget is flexible but timeline is tight.'},
 {id:5,name:'Moss Interiors',contact:'Tara Moss',note:'Website copy and photo direction. Very responsive, pays on time.'}];
let projects=[{id:1,name:'Northwind brand refresh',client:1,progress:0},{id:2,name:'Fieldnote Q4 layouts',client:3,progress:0},{id:3,name:'Halcyon spring campaign',client:4,progress:0}];
let tasks=[
 {id:1,title:'Send logo shortlist to Maya',status:'prog',pri:'High',due:1,client:1,project:1},
 {id:2,title:'Chase Alder & Co invoice',status:'todo',pri:'High',due:0,client:2,project:null},
 {id:8,title:'Send Fieldnote proof',status:'todo',pri:'High',due:-1,client:3,project:2},
 {id:3,title:'Finish Fieldnote spread 6–9',status:'prog',pri:'Medium',due:3,client:3,project:2},
 {id:4,title:'Kickoff call with Halcyon',status:'todo',pri:'Medium',due:5,client:4,project:3},
 {id:5,title:'Renew design software subscription',status:'todo',pri:'Low',due:6,client:null,project:null},
 {id:6,title:'Update portfolio site',status:'todo',pri:'Low',due:12,client:null,project:null},
 {id:7,title:'Export Moss moodboard',status:'done',pri:'Medium',due:-2,client:5,project:null},
 {id:9,title:'Moodboard round one',status:'done',pri:'Medium',due:-4,client:1,project:1},
 {id:10,title:'Final logo files',status:'todo',pri:'Medium',due:9,client:1,project:1},
 {id:11,title:'Layout spreads 1–5',status:'done',pri:'Medium',due:-3,client:3,project:2},
 {id:12,title:'Campaign concepts',status:'todo',pri:'High',due:4,client:4,project:3}];
let invoices=[
 {no:'INV-024',client:2,amount:2400,status:'overdue',due:-6},
 {no:'INV-025',client:1,amount:1800,status:'unpaid',due:4},
 {no:'INV-026',client:4,amount:900,status:'unpaid',due:12},
 {no:'INV-023',client:5,amount:1200,status:'paid',due:-15},
 {no:'INV-022',client:3,amount:1600,status:'paid',due:-20}];
const iso=n=>{const x=day(n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
let events=[{id:1,title:'Maya check-in call',date:iso(1),start:'10:00',end:'10:30',client:1},{id:2,title:'Deep work: Halcyon concepts',date:iso(0),start:'13:00',end:'15:00',client:4},{id:3,title:'Fieldnote review',date:iso(3),start:'14:00',end:'15:00',client:3},{id:4,title:'Invoice day',date:iso(5),start:'09:00',end:'09:30',client:null}];
const cname=id=>id?(clients.find(c=>c.id===id)||{}).name||'Personal':'Personal';
const glyph={todo:'',prog:'◐',done:'✓'},nextSt={todo:'done',prog:'done',done:'todo'};
const open=()=>tasks.filter(t=>t.status!=='done'),owed=()=>invoices.filter(i=>i.status!=='paid');
const cOpts=(p)=>(p?'':'<option value="">Personal</option>')+clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');

let view='Dashboard',sel=null,filt='All',q='',lastLit=null,firstNav=true;
let pitch={text:'',res:null,busy:false,err:'',tab:'Verdict'};
const views=['Dashboard','Clients','Projects','Tasks','Calendar','Invoices','Money','Analytics','Files','Inventory','Product Ideas','Pitch Lab','Help','Settings'];const unread=new Set(),busyT=new Set();
function nav(){let n=0;const btn=v=>`<button class="nav ${v===view?'on':''}" data-go="${v}" ${firstNav?`style="animation:navin .6s both;animation-delay:${(n++)*50}ms"`:''}>${v}${AIT.includes(v)?'<span class="tag ml-auto">AI</span>':''}${busyT.has(v)?'<span class="nd w"></span>':unread.has(v)?'<span class="nd"></span>':''}${locked(v)?LOCK:''}</button>`;$('#nav').innerHTML=NG.map(g=>`<div class="hidden md:block lbl px-3 pt-4 pb-1">${g[0]}</div>`+g[1].map(btn).join('')).join('');firstNav=false}
function go(v){if(locked(v))return toast('Sign up free to unlock '+v+'.');view=v;sel=null;unread.delete(v);if(['Pitch Lab','Product Ideas','Calendar'].includes(v))gd.ai=1;render()}
const head=(t,s)=>`<div class="rv" data-d="u"><h1 class="serif text-4xl md:text-5xl">${t}</h1>${s?`<p class="text-mute mt-2">${s}</p>`:''}</div>`;

function taskRow(t){const d=t.status==='done',hot=!d&&t.pri==='High'&&t.due<=2;return `<div class="row flex flex-wrap items-center gap-x-3 gap-y-1 py-3 cursor-pointer" data-t="${t.id}"><button class="st ${t.status==='prog'?'d1':d?'d2':''}${t.id===lastLit?' lit':''}" data-t="${t.id}" aria-label="Complete">${glyph[t.status]}</button><div class="flex-1 min-w-0" style="min-width:8rem"><div class="text-sm truncate ${d?'line-through text-mute':''}">${esc(t.title)}</div><div class="text-xs text-mute">${esc(cname(t.client))}${t.project?' · '+esc(pname(t.project)):''}${t.due<0&&!d?' · Overdue':''}</div></div>${flag(t.due,d)}${hot?'<span class="tag hi">Do first</span>':`<span class="tag">${t.pri}</span>`}<select class="box !py-0.5 !px-1 text-xs" data-ts="${t.id}" aria-label="Status">${[['todo','To do'],['prog','In progress'],['done','Completed']].map(o=>`<option value="${o[0]}" ${t.status===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><input type="date" class="box !py-0.5 !px-1 text-xs" data-td="${t.id}" value="${iso(t.due)}" aria-label="Due date"></div>`}
const taskForm=()=>`<form id="taskF" class="flex flex-wrap gap-2 mt-4"><input name="v" class="box flex-1" style="min-width:10rem" placeholder="Add a task, e.g. “Send proofs tomorrow”"><select name="proj" class="box"><option value="">No project</option>${projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><button class="btn" type="submit">Add</button></form>`;
const invRow=i=>`<div class="row flex items-center gap-3 py-3 text-sm"><div class="flex-1 min-w-0"><div class="truncate">${esc(cname(i.client))}</div><div class="text-xs text-mute">${i.no} · ${i.status==='paid'?'Paid':i.status==='overdue'?'Overdue':'Due '+fmt(i.due)}</div></div>${i.status==='overdue'?OVER:i.status==='unpaid'&&i.due<=7?WARN:''}<div class="text-right"><div>${money(i.amount)}</div><span class="tag ${i.status==='overdue'?'hi':''}">${i.status}</span></div></div>`;
const pw={High:3,Medium:2,Low:1},score=t=>pw[t.pri]*10+(t.due<0?9:t.due===0?8:t.due<=2?6:t.due<=7?3:0);
const sortT=a=>a.slice().sort((x,y)=>(x.status==='done')-(y.status==='done')||score(y)-score(x)||x.due-y.due);
const pcalc=p=>{const ts=tasks.filter(t=>t.project===p.id);return ts.length?Math.round(100*ts.filter(t=>t.status==='done').length/ts.length):p.progress};
const pname=id=>(projects.find(p=>p.id===id)||{}).name||'';

function dashboard(){
 const soon=open().filter(t=>t.due<=7).sort((a,b)=>a.due-b.due),unpaid=owed().reduce((s,i)=>s+i.amount,0);
 const hr=new Date().getHours(),g=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
 const M=[['Active clients',clients.length,'across '+projects.length+' projects','Clients'],['Upcoming deadlines',soon.length,'in the next 7 days','Tasks'],['Unpaid invoices',unpaid,owed().length+' outstanding','Invoices','$'],['Pending tasks',open().length,tasks.filter(t=>t.status==='prog').length+' in progress','Tasks']];
 return `<div class="view"><div class="rv" data-d="u"><div class="lbl">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div><h1 class="serif text-4xl md:text-5xl mt-2">${g}${prof&&prof.name?', '+esc(prof.name):''}.</h1><p class="text-mute mt-2">Here’s where things stand. Tap any box to open it.</p></div>
 ${guideCard()}<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-10">${M.map((m,i)=>`<div class="card go p-5 rv" data-d="s" data-i="${i}" data-go="${m[3]}" role="button" tabindex="0"><div class="lbl">${m[0]}</div><div class="text-3xl font-semibold tracking-tight mt-3"><span class="cnt" data-n="${m[1]}" data-p="${m[4]||''}">${m[4]||''}${m[1].toLocaleString('en-US')}</span></div><div class="text-xs text-mute mt-1">${m[2]}</div></div>`).join('')}</div>
 <div class="grid lg:grid-cols-5 gap-6 mt-6">

function localPitch(t){const l=t.toLowerCase(),w=t.split(/\s+/).length,pm=l.match(/\$\s?(\d+)/),price=pm?+pm[1]:/free/.test(l)?0:null;

 const score=Math.min(95,25+(F.price&&12)+(F.aud&&14)+(F.prob&&14)+(F.diff&&14)+(F.detail&&10)+Math.min(8,w/5)|0);
 const ok={price:'You mention pricing, so people can judge value.',aud:'You name who it’s for.',prob:'You describe a real problem.',diff:'You say what makes it different.',detail:'The pitch has enough detail to understand.'};

 const people=Object.keys(PA).map(n=>{const p=PA[n];let i=Math.round(score/10);
  if(price>50&&p.b)i-=p.b+1;else if(price!==null&&price<=15&&p.b)i+=1;
  if(/\b(app|platform|ai|software|subscription|dashboard)\b/.test(l)&&p.k)i-=p.k;

 if(id==='gEmail'){tmp={email:String(d.get('email')).trim()};code=String(100000+Math.floor(Math.random()*900000));gs='code';gerr=''}
 else if(id==='gCode'){if(String(d.get('c')).trim()===code){gs='name';gerr=''}else gerr='That code doesn’t match. Please try again.'}
 else if(id==='gName'){const n=String(d.get('n')).trim();if(!n)return;prof={name:n,email:tmp.email||''};store.set(prof);gs='home';updFoot()}
 gate()});
$('#brand').addEventListener('click',()=>{if(prof){gs='home';gate()}});

boot();
